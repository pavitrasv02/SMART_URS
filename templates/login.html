{% extends 'base.html' %}
{% load static %}

{% block title %}Login{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>



    <div class="form-box">
        <form method="POST" action="{% url 'login' %}" class="login-container" id="login">
            {% csrf_token %}
            {% if form.errors %}
                <div class="alert alert-danger">Invalid login credentials.</div>
            {% endif %}
            <div class="top">
                <span>Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></span>
                <header>Login</header>
            </div>
            <div class="input-box">
                <input type="email" name="email" class="input-field" placeholder="Email" required>
                <i class="bx bx-user"></i>
            </div>
            <div class="input-box">
                <input type="password" name="password" class="input-field" placeholder="Password" required>
                <i class="bx bx-lock-alt"></i>
            </div>
            <div class="input-box">
                <input type="submit" class="submit" value="Sign In">
            </div>
            <div class="two-col">
                <div class="one">
                    <input type="checkbox" id="login-check" name="remember">
                    <label for="login-check">Remember Me</label>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
function myMenuFunction() {
    var i = document.getElementById("navMenu");
    if(i.className === "nav-menu") {
        i.className += " responsive";
    } else {
        i.className = "nav-menu";
    }
}
</script>
{% endblock %}
