{% extends 'base.html' %}
{% load static %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>



    <div class="form-box">
        <form method="POST" action="{% url 'signup' %}" class="login-container" id="signup">
            {% csrf_token %}
            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <div class="top">
                <header>Sign Up</header>
            </div>
            <div class="input-box">
                <input type="text" name="name" class="input-field" placeholder="Full Name" required>
                <i class="bx bx-user"></i>
            </div>
            <div class="input-box">
                <input type="email" name="email" class="input-field" placeholder="Email" required>
                <i class="bx bx-envelope"></i>
            </div>
            <div class="input-box">
                <input type="tel" name="phone" class="input-field" placeholder="Phone Number" required>
                <i class="bx bx-phone"></i>
            </div>
            <div class="input-box">
                <input type="text" name="address" class="input-field" placeholder="Address" required>
                <i class="bx bx-home"></i>
            </div>
            <div class="input-box">
                <input type="password" name="password" class="input-field" placeholder="Password" required>
                <i class="bx bx-lock-alt"></i>
            </div>
            <div class="input-box">
                <input type="password" name="confirm_password" class="input-field" placeholder="Confirm Password" required>
                <i class="bx bx-lock-alt"></i>
            </div>
            <div class="input-box">
                <input type="submit" class="submit" value="Register">
            </div>
            <div class="two-col">
                <div class="one">
                    <label>Already have an account? <a href="{% url 'login' %}">Login</a></label>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
function myMenuFunction() {
    var i = document.getElementById("navMenu");
    if(i.className === "nav-menu") {
        i.className += " responsive";
    } else {
        i.className = "nav-menu";
    }
}
</script>
{% endblock %}
